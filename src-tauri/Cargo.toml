[package]
name = "kinglight"
version = "0.1.0"
description = "Kinglight desktop console and Art-Net output engine"
authors = ["zzdevxx"]
edition = "2024"
rust-version = "1.100"

[lib]
name = "kinglight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kinglight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
